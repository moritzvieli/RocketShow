name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Unit tests
    # Pull requests from branches of this repository are already tested by the push
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Run the unit tests
        run: ./mvnw -B test -Dskip.npm -Dskip.installnodenpm

  build:
    name: Build with web app
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('src/main/webapp/package-lock.json') }}
      - name: Build the application including the web app
        run: ./mvnw -B package -DskipTests
      - uses: actions/upload-artifact@v4
        with:
          name: rocketshow-jar
          path: target/rocketshow.jar
          retention-days: 14
